name: Issue quality gates
run-name: Issue 1191 quality gates

# This branch belongs to the contributor fork; the change under review is checked out below.
on:
  push:
    branches: [codex/issue-loop-ci]

permissions:
  contents: read

concurrency:
  group: issue-quality-gates-${{ github.sha }}
  cancel-in-progress: false

env:
  VERIFY_COMMIT: 3409c68f20f2f6e22188f6d82f9cef913397ad06
  FFMPEG_TEST_ORACLE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-11-13-04/ffmpeg-n8.1.3-17-gc389840894-linux64-gpl-8.1.tar.xz
  FFMPEG_TEST_ORACLE_SHA256: 3bd8a8427ab6b20d8e27bec92a038f605d8b25f393469a58e1aa4b453019b368
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_BUILD_JOBS: "2"
  RAYON_NUM_THREADS: "2"
  RUST_TEST_THREADS: "2"

jobs:
  quality:
    name: Format, clippy, regression tests, layers, assets, wasm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFY_COMMIT }}
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFY_COMMIT"
      - name: Install native dependencies and test oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libgtk-3-dev ffmpeg fonts-noto-cjk
      # Executables are external test oracles only; they are not linked or shipped.
      - name: Install APV-capable test oracles
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ffmpeg-test-oracle.tar.xz"
          bindir="$RUNNER_TEMP/ffmpeg-test-oracle"
          curl --fail --location --retry 3 "$FFMPEG_TEST_ORACLE_URL" -o "$archive"
          echo "$FFMPEG_TEST_ORACLE_SHA256  $archive" | sha256sum --check
          mkdir -p "$bindir"
          tar -xJf "$archive" --strip-components=2 -C "$bindir" \
            ffmpeg-n8.1.3-17-gc389840894-linux64-gpl-8.1/bin/ffmpeg \
            ffmpeg-n8.1.3-17-gc389840894-linux64-gpl-8.1/bin/ffprobe
          "$bindir/ffprobe" -version
          "$bindir/ffmpeg" -hide_banner -decoders > "$RUNNER_TEMP/test-oracle-decoders.txt"
          grep -Eq '[[:space:]]apv[[:space:]]' "$RUNNER_TEMP/test-oracle-decoders.txt"
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Limit build jobs to runner capacity
        shell: bash
        run: |
          jobs=$(nproc)
          if (( jobs > 4 )); then jobs=4; fi
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: filmcraft-issue-quality-gates
      # Full workspace tests run locally before each issue commit. On Linux, run the
      # affected crate suites and check all targets and the remaining workspace gates.
      - name: Checks and regression suites for the issue commit
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --release -- -D warnings
          cargo test --release -p filmcraft-engine -p filmcraft-project -p filmcraft-export -p filmcraft-tts-text -p filmcraft-audio-dsp
          cargo test --release -p filmcraft-ui-egui --lib --test transitions_ui --test transition_drop_ui --test timeline_trim_ui --test masks_ui --test meters_ui --test timeline_scroll_ui --test timeline_tabs_ui --test clip_dialogs_ui --test settings_ui
          cargo xtask layers
          cargo xtask assets
          cargo xtask wasm
